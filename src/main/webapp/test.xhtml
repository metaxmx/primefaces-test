    <h:head>
        <title>PrimeFaces Test</title>
        <h:outputScript name="test.js" />
        <h:outputStylesheet name="test.css" />
    </h:head>
    <h:body>

        <h1>Reproducer: TriStateCheckbox ReadOnly/Disabled shouldn't call value change handlers when processing updates</h1>
        <h:form id="frmTest">
            <p:growl globalOnly="true" showDetail="true"/>

            <h3>Real Value binding</h3>

            <p:triStateCheckbox id="triStateExample" value="#{testView.value}" style="margin-right: 1em;">
                <p:ajax event="change" process="@form" update="@form"/>
            </p:triStateCheckbox>
            <h:outputLabel for="triStateExample" value="Standard Value"/>

            <p>
                Changing the value of this input will rerender the form <br/>
                (including the read-only or disabled tri-state checkboxes)
            </p>

            <hr/>

            <p:triStateCheckbox id="triStateExampleDisabled" value="#{testView.valueDisabled}"
                                style="margin-right: 1em;" disabled="true" />
            <h:outputLabel for="triStateExampleDisabled" value="Standard Value (Disabled)"/>

            <br/>

            <p:triStateCheckbox id="triStateExampleReadOnly" value="#{testView.valueReadOnly}"
                                style="margin-right: 1em;" readonly="true"/>
            <h:outputLabel for="triStateExampleReadOnly" value="Standard Value (Read-Only)"/>
