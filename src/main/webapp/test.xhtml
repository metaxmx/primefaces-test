<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">

    <h:head>
        <title>PrimeFaces Test</title>
        <h:outputScript name="test.js" />
        <h:outputStylesheet name="test.css" />
    </h:head>
    <h:body>

    <h1>#{testView.string}</h1>
    <h:form id="frmTest">
        <!-- outer default command -->
        <p:commandButton id="defaultButtonOuter" value="Default Outer"
                         onclick="alert('outer command clicked'); return false;"/>
        <p:defaultCommand target="defaultButtonOuter"/>

        <!-- nested panel -->
        <p:outputPanel id="innerPanel" layout="block" style="margin-top: 1rem;">

            <p:inputText id="inputTest" value="Test ..."/>

            <!-- inner default command -->
            <p:commandButton id="defaultButtonInner" value="Default Inner"
                             onclick="alert('inner command clicked'); return false;"/>
            <p:defaultCommand target="defaultButtonInner" scope="innerPanel"/>

        </p:outputPanel>
    </h:form>

</h:body>
</html>
