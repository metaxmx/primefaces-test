<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">

    <h:head>
        <title>PrimeFaces Test</title>
        <h:outputScript name="test.js" />
        <h:outputStylesheet name="test.css" />
    </h:head>
    <h:body>

        <h1>Reproducer: TriStateChekbox readonly with constant value</h1>
        <h:form id="frmTest">
            <p:growl globalOnly="true" showDetail="true"/>

            <h3>Real Value binding</h3>
            <p:triStateCheckbox id="triStateExample" value="#{testView.value}" style="margin-right: 1em;">
                <p:ajax event="change" process="@form" update="@form"/>
            </p:triStateCheckbox>
            <h:outputLabel for="triStateExample" value="Standard Value"/>

            <p>
                Changing the value of this input will rerender the form <br/>
                (including the read-only tri-state checkboxes with constant value)
            </p>

            <hr/>

            <h3>Constant values (Disabled)</h3>
            <p:outputPanel layout="block">
                <p:triStateCheckbox id="triStateConstantNull" value="#{null}" disabled="true" style="margin-right: 1em;" />
                <h:outputLabel value="Constant null"/>
            </p:outputPanel>
            <p:outputPanel layout="block">
                <p:triStateCheckbox id="triStateConstantTrue" value="#{true}" disabled="true" style="margin-right: 1em;" />
                <h:outputLabel value="Constant true"/>
            </p:outputPanel>
            <p:outputPanel layout="block">
                <p:triStateCheckbox id="triStateConstantFalse" value="#{false}" disabled="true" style="margin-right: 1em;" />
                <h:outputLabel value="Constant false"/>
            </p:outputPanel>


        </h:form>

    </h:body>
</html>
